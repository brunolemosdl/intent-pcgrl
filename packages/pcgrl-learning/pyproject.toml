[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcgrl-learning"
version = "0.2.0"
description = "PCGRL models, training, and level generation"
requires-python = ">=3.11"
dependencies = [
    "pcgrl-core",
    "pcgrl-runtime",
    "pcgrl-rendering",
    "pcgrl-bridge",
    "torch>=2.2",
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",
    "tensorboard>=2.16",
    "gymnasium>=0.29",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]
