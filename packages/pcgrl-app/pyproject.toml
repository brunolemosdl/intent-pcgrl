[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcgrl-app"
version = "0.2.0"
description = "PCGRL CLI and orchestration pipelines"
requires-python = ">=3.11"
dependencies = [
    "pcgrl-core",
    "pcgrl-runtime",
    "pcgrl-rendering",
    "pcgrl-bridge",
    "pcgrl-learning",
    "typer>=0.12",
    "rich>=13.7",
    "orjson>=3.10",
    "numpy>=1.26",
]

[project.optional-dependencies]
llm = ["openai>=1.55"]
analysis = ["matplotlib>=3.8"]

[project.scripts]
intent-pcgrl = "pcgrl.app.commands.app:app"

[tool.setuptools.packages.find]
where = ["src"]
