[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcgrl-bridge"
version = "0.2.0"
description = "PCGRL Mario AI Framework Java bridge"
requires-python = ">=3.11"
dependencies = [
    "pcgrl-core",
]

[tool.setuptools.packages.find]
where = ["src"]
