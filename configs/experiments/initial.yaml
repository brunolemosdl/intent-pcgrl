# Steps recalibrated 2026-06-11 for the two-phase episode (~34 decisions vs ~10
# compose-only): 3x the previous budget keeps the episode count comparable.
training:
  total_steps: 750000
  num_environments: 4
  rollout_steps: 1024
  batch_size: 256
  num_epochs: 4
  learning_rate: 0.0003
  entropy_coefficient: 0.02
  save_interval_steps: 150000
  log_interval: 5
evaluation:
  eval_every_steps: 150000
  eval_episodes: 2
  num_runs: 2
